name: Build & Release Linux Packages

on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag like v0.9.1

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cryptography
          
      - name: Build Linux Binary with PyInstaller
        run: |
          # If icon.png exists, use it; otherwise, build without it
          if [ -f spg/icon.png ]; then
            pyinstaller --noconfirm --onefile --windowed --name "ibijan-pass" --icon=spg/icon.png run.py
          else
            pyinstaller --noconfirm --onefile --windowed --name "ibijan-pass" run.py
          fi
          
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential rpm libfuse2
          sudo gem install --no-document fpm
          
      - name: Create .deb and .rpm packages
        run: |
          mkdir -p package/usr/bin
          mkdir -p package/usr/share/applications
          mkdir -p package/usr/share/icons/hicolor/256x256/apps
          
          # Copy binary
          cp dist/ibijan-pass package/usr/bin/ibijan-pass
          
          # Create desktop entry
          cat << 'EOF' > package/usr/share/applications/ibijan-pass.desktop
          [Desktop Entry]
          Name=iBijan Pass
          Comment=Smart Password Generator
          Exec=ibijan-pass
          Icon=ibijan-pass
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF
          
          # Copy icon if exists
          if [ -f spg/icon.png ]; then
            cp spg/icon.png package/usr/share/icons/hicolor/256x256/apps/ibijan-pass.png
          fi
          
          # Build .deb
          fpm -s dir -t deb -n ibijan-pass -v 0.9.1 -C package usr/
          
          # Build .rpm
          fpm -s dir -t rpm -n ibijan-pass -v 0.9.1 -C package usr/
          
      - name: Build AppImage
        run: |
          # Download appimagetool
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          
          # Create AppDir structure
          mkdir -p AppDir/usr/bin
          cp dist/ibijan-pass AppDir/usr/bin/
          
          # Create desktop file for AppDir
          cat << 'EOF' > AppDir/ibijan-pass.desktop
          [Desktop Entry]
          Name=iBijan Pass
          Comment=Smart Password Generator
          Exec=ibijan-pass
          Icon=ibijan-pass
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF
          
          # Copy icon if exists, otherwise create a fallback 1x1 transparent PNG
          if [ -f spg/icon.png ]; then
            cp spg/icon.png AppDir/ibijan-pass.png
            cp spg/icon.png AppDir/.DirIcon
          else
            echo "⚠️ icon.png not found in spg/. Using a fallback 1x1 PNG."
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > AppDir/ibijan-pass.png
            cp AppDir/ibijan-pass.png AppDir/.DirIcon
          fi
          
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          exec "$APPDIR/usr/bin/ibijan-pass" "$@"
          EOF
          chmod +x AppDir/AppRun
          # ⬆️ ------------------------------------------- ⬆️
          
          # Build AppImage (using --appimage-extract-and-run to avoid FUSE issues in CI)
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir ibijan-pass-0.9.1-x86_64.AppImage
          
          chmod +x ibijan-pass-0.9.1-x86_64.AppImage                    
      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            *.deb
            *.rpm
            *.AppImage

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/linux-packages/*