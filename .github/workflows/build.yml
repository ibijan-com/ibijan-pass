name: Build & Release Linux Packages

on:
  push:
    tags:
      - 'v*'

# Default permission is read-only.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    # Only this job needs permission to publish a release.
    permissions:
      contents: write

    steps:
      # 1. Checkout source code (Fixed version from v7 to v4)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python (Fixed version from v7 to v5)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Validate release tag
      - name: Extract and validate version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: Invalid release tag: ${GITHUB_REF_NAME}"
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Release version: ${VERSION}"

      # 4. Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # 5. Basic source validation
      - name: Validate source files
        run: |
          set -euo pipefail

          test -s spg/icon.png

          python -m compileall -q spg run.py

          echo "Source validation completed."

      # 6. Build Linux executable
      - name: Build Linux Binary with PyInstaller
        run: |
          set -euo pipefail

          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name "ibijan-pass" \
            --add-data "spg/icon.png:." \
            run.py

          test -s dist/ibijan-pass

      # 7. Install packaging tools
      - name: Install packaging tools
        run: |
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            ruby \
            ruby-dev \
            rubygems \
            build-essential \
            rpm \
            desktop-file-utils \
            imagemagick

          sudo gem install --no-document fpm

      # 8. Create Debian and RPM packages
      - name: Create DEB and RPM packages
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p package/usr/bin
          mkdir -p package/usr/share/applications

          # Install executable
          install -Dm755 dist/ibijan-pass \
            package/usr/bin/ibijan-pass

          # Install icon in Pixmaps (known working Ubuntu path)
          install -Dm644 spg/icon.png \
            package/usr/share/pixmaps/ibijan-pass.png

          # Also install the icon in the standard hicolor theme
          install -Dm644 spg/icon.png \
            package/usr/share/icons/hicolor/512x512/apps/ibijan-pass.png

          # Create desktop entry
          cat << 'EOF' > package/usr/share/applications/ibijan-pass.desktop
          [Desktop Entry]
          Version=1.0
          Name=iBijan Pass
          Comment=Memorable Password Generation
          Exec=/usr/bin/ibijan-pass
          Icon=/usr/share/pixmaps/ibijan-pass.png
          Terminal=false
          Type=Application
          Categories=Utility;Security;
          StartupWMClass=Ibijan-pass
          EOF

          # Validate desktop entry
          desktop-file-validate \
            package/usr/share/applications/ibijan-pass.desktop

          # Build DEB
          fpm -s dir -t deb \
            -n ibijan-pass \
            -v "$VERSION" \
            -C package usr/

          # Build RPM
          fpm -s dir -t rpm \
            -n ibijan-pass \
            -v "$VERSION" \
            -C package usr/

          # Validate generated packages
          DEB_FILE="$(find . -maxdepth 1 -type f \
            -name 'ibijan-pass*.deb' -print -quit)"

          RPM_FILE="$(find . -maxdepth 1 -type f \
            -name 'ibijan-pass*.rpm' -print -quit)"

          if [[ -z "$DEB_FILE" || -z "$RPM_FILE" ]]; then
            echo "ERROR: DEB or RPM package was not generated."
            exit 1
          fi

          # Verify DEB contents
          dpkg-deb --contents "$DEB_FILE" |
            grep -F 'usr/share/pixmaps/ibijan-pass.png'

          dpkg-deb --contents "$DEB_FILE" |
            grep -F 'usr/share/applications/ibijan-pass.desktop'

          # Verify RPM contents
          rpm -qlp "$RPM_FILE" |
            grep -Fx '/usr/share/pixmaps/ibijan-pass.png'

          rpm -qlp "$RPM_FILE" |
            grep -Fx '/usr/share/applications/ibijan-pass.desktop'

          echo "DEB and RPM validation completed."

      # 9. Build AppImage
      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail

          # Download AppImageKit
          wget -q \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O /tmp/appimagetool.AppImage

          chmod +x /tmp/appimagetool.AppImage

          # Prepare AppDir
          mkdir -p AppDir/usr/bin

          install -Dm755 dist/ibijan-pass \
            AppDir/usr/bin/ibijan-pass

          # Install application icon
          install -Dm644 spg/icon.png \
            AppDir/ibijan-pass.png

          cp AppDir/ibijan-pass.png AppDir/.DirIcon

          # Create AppImage desktop entry
          cat << 'EOF' > AppDir/ibijan-pass.desktop
          [Desktop Entry]
          Version=1.0
          Name=iBijan Pass
          Comment=Memorable Password Generation
          Exec=ibijan-pass
          Icon=ibijan-pass
          Terminal=false
          Type=Application
          Categories=Utility;Security;
          StartupWMClass=Ibijan-pass
          EOF

          # Create AppRun
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          set -eu
          exec "$APPDIR/usr/bin/ibijan-pass" "$@"
          EOF

          chmod +x AppDir/AppRun

          # Build AppImage
          APPIMAGE_FILE="ibijan-pass-${VERSION}-x86_64.AppImage"

          ARCH=x86_64 \
            /tmp/appimagetool.AppImage \
            --appimage-extract-and-run \
            AppDir \
            "$APPIMAGE_FILE"

          chmod +x "$APPIMAGE_FILE"

          test -s "$APPIMAGE_FILE"

      # 10. Generate checksums
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            ./*.deb \
            ./*.rpm \
            ./*.AppImage \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      # 11. Publish directly to GitHub Releases
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.rpm
            *.AppImage
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          body_path: CHANGELOG.md
          generate_release_notes: true