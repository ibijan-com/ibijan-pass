name: Build & Release Linux Packages

on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag like v1.1.2

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cryptography
          
      - name: Build Linux Binary with PyInstaller
        run: |
          if [ -f spg/icon.png ]; then
            pyinstaller --noconfirm --onefile --windowed --name "ibijan-pass" --icon=spg/icon.png --add-data "spg/icon.png:." run.py
          else
            pyinstaller --noconfirm --onefile --windowed --name "ibijan-pass" run.py
          fi          
          
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential rpm libfuse2
          sudo gem install --no-document fpm
          
      - name: Create .deb and .rpm packages
        run: |
          mkdir -p package/usr/bin
          mkdir -p package/usr/share/applications
          mkdir -p package/usr/share/icons/hicolor/256x256/apps
          
          cp dist/ibijan-pass package/usr/bin/ibijan-pass
          
          cat << 'EOF' > package/usr/share/applications/ibijan-pass.desktop
          [Desktop Entry]
          Name=iBijan Pass
          Comment=Smart Password Generator
          Exec=ibijan-pass
          Icon=ibijan-pass
          Terminal=false
          Type=Application
          Categories=Utility;
          StartupWMClass=ibijan-pass
          EOF
          
          if [ -f spg/icon.png ]; then
            cp spg/icon.png package/usr/share/icons/hicolor/256x256/apps/ibijan-pass.png
          fi
          
          # Build using the dynamic VERSION variable
          fpm -s dir -t deb -n ibijan-pass -v ${{ env.VERSION }} -C package usr/
          fpm -s dir -t rpm -n ibijan-pass -v ${{ env.VERSION }} -C package usr/
          
      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage
          
          mkdir -p AppDir/usr/bin
          cp dist/ibijan-pass AppDir/usr/bin/
          
          cat << 'EOF' > AppDir/ibijan-pass.desktop
          [Desktop Entry]
          Name=iBijan Pass
          Comment=Smart Password Generator
          Exec=ibijan-pass
          Icon=ibijan-pass
          Terminal=false
          Type=Application
          Categories=Utility;
          StartupWMClass=ibijan-pass
          EOF
          
          if [ -f spg/icon.png ]; then
            cp spg/icon.png AppDir/ibijan-pass.png
            cp spg/icon.png AppDir/.DirIcon
          else
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > AppDir/ibijan-pass.png
            cp AppDir/ibijan-pass.png AppDir/.DirIcon
          fi
          
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          exec "$APPDIR/usr/bin/ibijan-pass" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          # Build AppImage using dynamic VERSION variable
          /tmp/appimagetool.AppImage --appimage-extract-and-run AppDir ibijan-pass-${{ env.VERSION }}-x86_64.AppImage
          chmod +x ibijan-pass-${{ env.VERSION }}-x86_64.AppImage

      # NEW: Generate SHA256 Checksums for release integrity
      - name: Generate Checksums
        run: |
          sha256sum *.deb *.rpm *.AppImage > SHA256SUMS.txt

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            *.deb
            *.rpm
            *.AppImage
            SHA256SUMS.txt

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/linux-packages/*
          body_path: CHANGELOG.md
          generate_release_notes: true