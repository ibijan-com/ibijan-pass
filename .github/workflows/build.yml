name: Build & Release Executables

on:
  push:
    tags:
      - 'v*' 

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cryptography
      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "iBijan-Pass-Windows-v0.9.1" run.py
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v3
        with:
          name: windows-exe
          path: dist/iBijan-Pass-Windows-v0.9.1.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cryptography
      - name: Build Linux Binary
        run: |
          pyinstaller --noconfirm --onefile --name "iBijan-Pass-Linux-v0.9.1" run.py
      - name: Create .deb (using fpm)
        run: |
          sudo apt-get install -y ruby ruby-dev rubygems build-essential
          sudo gem install --no-document fpm
          mkdir -p package/usr/bin
          cp dist/iBijan-Pass-Linux-v0.9.1 package/usr/bin/ibijan-pass
          fpm -s dir -t deb -n ibijan-pass -v 0.9.1 -C package usr/bin/ibijan-pass
      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: linux-packages
          path: |
            dist/iBijan-Pass-Linux-v0.9.1
            *.deb

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cryptography
      - name: Build macOS App
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "iBijan-Pass-Mac-v0.9.1" run.py
      - name: Zip the App
        run: |
          cd dist
          zip -r iBijan-Pass-Mac-v0.9.1.zip iBijan-Pass-Mac-v0.9.1.app iBijan-Pass-Mac-v0.9.1
      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: macos-app
          path: dist/iBijan-Pass-Mac-v0.9.1.zip

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            windows-exe/*
            linux-packages/*
            macos-app/*